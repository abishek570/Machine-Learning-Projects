<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samazon Store | Premium Groceries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container header-container">
            <div class="logo">
                <i class="fa-solid fa-leaf"></i> Samazon Store
            </div>

        </div>
    </header>



    <main class="container">
        <div class="section-header">
            <h2>Featured Products</h2>
            <p>Handpicked essentials just for you</p>
        </div>

        <div id="product-grid" class="product-grid">
            <!-- Products will be injected here by JS -->
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading Products...
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content" style="text-align: center; display: block;">
            <p style="font-size: 1.2rem; margin-bottom: 1rem;">"Let food be thy medicine and medicine be thy food."</p>
        </div>
    </footer>

    <script src="/static/script.js"></script>
</body>

</html>
